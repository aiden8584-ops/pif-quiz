<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PIF 단어장</title>
<meta name="theme-color" content="#fdf7f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --navy: #14204a; --or: #f15a1f; --ink: #1d2233; --sub: #5d6276; --bg: #fdf7f2; --line: #e9e3dc }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent }
  body { min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center }
  .wrap { width: 100%; max-width: 440px; padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 22px;
          background: radial-gradient(circle at 105% -5%, #cfe0f7 0, rgba(207,224,247,0) 45%), radial-gradient(circle at -10% 60%, #fcd9c2 0, rgba(252,217,194,0) 40%) }
  .brand { font-size: 13px; font-weight: 700; color: var(--navy); display: flex; justify-content: space-between }
  .brand b { font-weight: 900 }
  .hero { padding-top: 8px }
  .kick { font-size: 12px; letter-spacing: 3px; font-weight: 700; color: #2b3f94 }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 46px; line-height: 1; margin-top: 8px; color: var(--navy); letter-spacing: -1px }
  h1 span { color: var(--or) }
  .exam { display: inline-block; margin-top: 14px; background: var(--or); color: #fff; font-weight: 700; font-size: 15px; padding: 6px 12px; border-radius: 6px }
  .lead { margin-top: 12px; font-size: 15px; color: var(--sub); line-height: 1.6 }
  .btn { display: flex; align-items: center; gap: 16px; text-decoration: none; border-radius: 18px; padding: 20px; min-height: 96px; box-shadow: 0 6px 18px rgba(20,32,74,.08) }
  .btn .ic { flex: none; width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center }
  .btn .ic svg { width: 28px; height: 28px }
  .btn .t { font-size: 20px; font-weight: 900; letter-spacing: -.5px }
  .btn .s { font-size: 13px; margin-top: 4px; line-height: 1.45 }
  .btn .ar { margin-left: auto; font-size: 22px; font-weight: 700 }
  .b1 { background: var(--navy); color: #fff }
  .b1 .ic { background: rgba(255,255,255,.14) }
  .b1 .s { color: #c9cfe6 }
  .b2 { background: #fff; color: var(--ink); border: 1.5px solid var(--line) }
  .b2 .ic { background: #fff1ea }
  .b2 .s { color: var(--sub) }
  .flow { font-size: 13px; color: var(--sub); text-align: center; line-height: 1.6 }
  .flow b { color: var(--navy) }
  .foot { margin-top: auto; text-align: center; font-size: 12px; color: #9a9db0 }
  .seg { display: flex; gap: 6px; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 5px }
  .seg button { flex: 1; border: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 700; color: var(--sub); padding: 13px 6px; border-radius: 12px; cursor: pointer }
  .seg button.on { background: var(--navy); color: #fff }
  .seg-cap { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: -12px }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><span>PIF ENGLISH ACADEMY</span><span>결국, <span id="sch">○○고</span> 영어는 <b>주찬솔</b></span></div>
  <section class="hero">
    <div class="kick">MOBILE VOCAB</div>
    <h1>VOCAB<br><span>ALL-IN-ONE</span></h1>
    <div class="exam" id="lab"></div>
    <p class="lead">종이 단어장 없이도 폰으로 외우고,<br>바로 시험까지 볼 수 있어요.</p>
  </section>

  <p class="seg-cap" id="segCap" hidden>단어장 고르기</p>
  <div class="seg" id="seg" hidden></div>

  <a class="btn b1" id="toCards" href="#">
    <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></g></svg></span>
    <span><span class="t">카드로 외우기</span><span class="s" style="display:block">눌러서 뒤집고, 모르는 단어만 다시</span></span>
    <span class="ar" aria-hidden="true">›</span>
  </a>
  <a class="btn b2" id="toQuiz" href="#">
    <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#f15a1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></g></svg></span>
    <span><span class="t">단어시험 보기</span><span class="s" style="display:block">결과는 선생님께 자동 전송</span></span>
    <span class="ar" aria-hidden="true">›</span>
  </a>

  <p class="flow">추천 순서 &nbsp;<b>종이 단어장</b> → <b>카드 복습</b> → <b>단어시험</b></p>
  <p class="foot" id="bad" hidden>QR 주소가 올바르지 않아요. 선생님께 다시 받아 주세요.</p>
  <p class="foot">Copyright © PIF English Academy</p>
</main>
<script src="common.js"></script>
<script>
(function () {
  var key = PIF.param('s'), b = PIF.BOOKS[key];
  if (!b) { document.getElementById('bad').hidden = false; document.getElementById('toCards').style.display = 'none'; document.getElementById('toQuiz').style.display = 'none'; return; }
  document.getElementById('sch').textContent = b.school;
  document.title = b.school + ' 단어장 · PIF';
  var warmed = {};
  function pick(k) {
    var bk = PIF.BOOKS[k];
    document.getElementById('lab').textContent = bk.label;
    document.getElementById('toCards').href = 'cards.html?s=' + encodeURIComponent(k);
    document.getElementById('toQuiz').href = 'quiz.html?s=' + encodeURIComponent(k);
    var bs = document.querySelectorAll('#seg button');
    for (var i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-k') === k ? 'on' : '';
    if (b.group) { try { localStorage.setItem('vmbook:' + b.group, k); } catch (e) {} }
    // 서버를 미리 깨워 두면 다음 화면의 첫 로딩이 빨라짐
    if (!warmed[k]) { warmed[k] = 1; try { fetch(PIF.API + '?api=cards&key=' + encodeURIComponent(k)).catch(function () {}); } catch (e) {} }
  }
  var start = key;
  if (b.group) {
    var keys = Object.keys(PIF.BOOKS).filter(function (k) { return PIF.BOOKS[k].group === b.group; });
    if (keys.length > 1) {
      // QR(그룹 대표 키)로 들어오면 마지막에 고른 단어장을, 카드·시험에서 돌아오면 그 단어장을 보여줌
      if (key === b.group) { try { var last = localStorage.getItem('vmbook:' + b.group); if (last && keys.indexOf(last) >= 0) start = last; } catch (e) {} }
      var seg = document.getElementById('seg');
      seg.innerHTML = keys.map(function (k) { return '<button type="button" data-k="' + k + '">' + PIF.esc(PIF.BOOKS[k].tab || PIF.BOOKS[k].label) + '</button>'; }).join('');
      seg.addEventListener('click', function (e) { var t = e.target.closest('button'); if (t) pick(t.getAttribute('data-k')); });
      seg.hidden = false; document.getElementById('segCap').hidden = false;
    }
  }
  pick(start);
})();
</script>
</body>
</html>
