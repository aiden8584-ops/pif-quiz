<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>카드 단어장 · PIF</title>
<meta name="theme-color" content="#fdf7f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root { --navy: #14204a; --or: #f15a1f; --ink: #1d2233; --sub: #5d6276; --bg: #fdf7f2; --line: #e9e3dc; --hl: #ffe3d4; --teal: #12806f }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent }
  body { min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; overscroll-behavior: none }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  a { color: inherit }
  .wrap { width: 100%; max-width: 440px; min-height: 100vh; min-height: 100dvh; padding: 18px 18px 22px; display: flex; flex-direction: column }
  [hidden] { display: none !important }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700; color: var(--navy); min-height: 44px }
  .top b { font-weight: 900 }
  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding-right: 8px; font-weight: 700; color: var(--navy); text-decoration: none }
  h2 { font-size: 22px; font-weight: 900; letter-spacing: -.5px; margin: 6px 0 4px; color: var(--navy) }
  .hint { font-size: 13px; color: var(--sub) }
  .sec { margin-top: 20px }
  .sec h3 { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center }
  .link { font-size: 13px; font-weight: 700; color: var(--or); min-height: 36px; padding: 0 4px }
  .lesson { margin-bottom: 12px }
  .lesson .ln { font-size: 13px; font-weight: 900; color: var(--navy); margin-bottom: 6px; display: flex; align-items: center; gap: 8px }
  .lesson .ln button { font-size: 12px; font-weight: 700; color: var(--sub); border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; min-height: 30px }
  .chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
  .chip { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-size: 15px; font-weight: 700; color: var(--ink); position: relative }
  .chips.short .chip { font-size: 14px; padding: 0 2px }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff }
  .chip .cnt { position: absolute; top: -7px; right: -5px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--or); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 0 5px }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #efe9e2; border-radius: 12px; padding: 4px; gap: 4px }
  .seg button { min-height: 44px; border-radius: 9px; font-size: 15px; font-weight: 700; color: var(--sub) }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--navy); box-shadow: 0 1px 4px rgba(20,32,74,.12) }
  .seg button:disabled { opacity: .45 }
  .go { margin-top: auto; padding-top: 22px }
  .primary { width: 100%; min-height: 56px; border-radius: 16px; background: var(--navy); color: #fff; font-size: 18px; font-weight: 900; letter-spacing: -.3px }
  .primary:disabled { background: #b9bccb }
  .secondary { width: 100%; min-height: 52px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line); font-size: 16px; font-weight: 700; color: var(--navy); display: flex; align-items: center; justify-content: center; text-decoration: none }
  .err { margin-top: 30px; padding: 16px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-size: 14px; line-height: 1.6 }

  /* study */
  .prog { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--navy) }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: #ebe4dc; overflow: hidden }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--navy), var(--or)); transition: width .25s }
  .tally { display: flex; gap: 8px; font-size: 12px; font-weight: 700 }
  .tally .k { color: var(--teal) } .tally .u { color: var(--or) }
  .stage { flex: 1; display: flex; align-items: stretch; margin: 14px 0; perspective: 1400px; min-height: 360px; position: relative }
  .card { position: relative; width: 100%; min-height: 360px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1); cursor: pointer; touch-action: pan-y }
  .card.flip { transform: rotateY(180deg) }
  .card.nofx { transition: none }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; background: #fff; border: 1.5px solid var(--line); box-shadow: 0 10px 28px rgba(20,32,74,.08); padding: 22px 20px; display: flex; flex-direction: column }
  .back-face { transform: rotateY(180deg); background: #fffaf6 }
  .tag { display: flex; justify-content: space-between; align-items: center; min-height: 44px }
  .tag span { font-size: 12px; font-weight: 700; color: var(--sub); background: #f4efe9; border-radius: 999px; padding: 4px 10px }
  .say { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #eef1f8 }
  .say svg { width: 22px; height: 22px }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; text-align: center; padding: 8px 4px }
  .w { font-family: 'Lora', serif; font-weight: 700; font-size: 38px; line-height: 1.15; color: var(--navy); word-break: keep-all; overflow-wrap: anywhere }
  .w.sm { font-size: 30px }
  .ko { font-size: 28px; font-weight: 900; line-height: 1.35; color: var(--ink); word-break: keep-all; letter-spacing: -.5px }
  .ex { font-family: 'Lora', serif; font-size: 16px; line-height: 1.55; color: #464b5f; text-align: left; background: #faf7f3; border-radius: 12px; padding: 12px 14px }
  .ex mark { background: var(--hl); color: var(--navy); font-weight: 700; border-radius: 4px; padding: 0 2px }
  .ex .blank { display: inline-block; min-width: 70px; border-bottom: 2px solid var(--or); color: transparent }
  .rel { display: flex; flex-direction: column; gap: 6px; text-align: left; font-family: 'Lora', serif; font-size: 16px; line-height: 1.45 }
  .rel div { display: flex; gap: 8px } .rel i { font-style: normal; font-weight: 700; font-family: 'Noto Sans KR'; flex: none; width: 18px }
  .rel .s i { color: var(--teal) } .rel .a i { color: var(--or) }
  .tap { text-align: center; font-size: 12px; color: #9a9db0 }
  .stamp { position: absolute; top: 26px; font-size: 18px; font-weight: 900; padding: 6px 12px; border-radius: 10px; border: 3px solid; opacity: 0; pointer-events: none; z-index: 3 }
  .stamp.k { right: 20px; color: var(--teal); transform: rotate(10deg) } .stamp.u { left: 20px; color: var(--or); transform: rotate(-10deg) }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
  .acts button { min-height: 60px; border-radius: 16px; font-size: 17px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2 }
  .acts small { font-size: 11px; font-weight: 500; opacity: .75; margin-top: 2px }
  .no { background: #fff; border: 2px solid var(--or) !important; color: var(--or) }
  .yes { background: var(--navy); color: #fff }

  /* done */
  .done { text-align: center; padding-top: 30px }
  .big { font-size: 26px; font-weight: 900; color: var(--navy); margin-top: 10px }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 }
  .stat { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 16px }
  .stat b { display: block; font-size: 30px; font-weight: 900 }
  .stat.k b { color: var(--teal) } .stat.u b { color: var(--or) }
  .stat span { font-size: 13px; color: var(--sub) }
  .col { display: flex; flex-direction: column; gap: 10px; margin-top: auto }
  .misslist { text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 16px; max-height: 220px; overflow: auto }
  .misslist div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px }
  .misslist div:last-child { border: 0 }
  .misslist b { font-family: 'Lora', serif; color: var(--navy) }
  .misslist span { color: var(--sub); text-align: right }
  .loading { margin: auto; text-align: center; color: var(--sub); font-size: 14px }
</style>
</head>
<body>
<main class="wrap">

  <!-- 범위 고르기 -->
  <section id="setup" hidden style="display:flex;flex-direction:column;flex:1">
    <div class="top"><a class="back" id="homeLink" href="#">‹ 처음으로</a><span>결국, <span class="sch">○○고</span> 영어는 <b>주찬솔</b></span></div>
    <h2>카드로 외우기</h2>
    <p class="hint">외울 범위를 고르세요. 여러 개 골라도 됩니다.</p>

    <div class="sec">
      <h3><span>범위</span><button class="link" id="allBtn" type="button">전체 선택</button></h3>
      <div id="lessons"></div>
    </div>

    <div class="sec">
      <h3><span>방향</span></h3>
      <div class="seg" id="dirSeg">
        <button type="button" data-v="ek" aria-pressed="true">영어 → 뜻</button>
        <button type="button" data-v="ke" aria-pressed="false">뜻 → 영어</button>
      </div>
    </div>

    <div class="sec">
      <h3><span>순서</span></h3>
      <div class="seg" id="ordSeg">
        <button type="button" data-v="seq" aria-pressed="true">순서대로</button>
        <button type="button" data-v="shuf" aria-pressed="false">섞기</button>
      </div>
    </div>

    <div class="sec">
      <h3><span>학습할 단어</span></h3>
      <div class="seg" id="setSeg">
        <button type="button" data-v="all" aria-pressed="true" id="setAll">전체</button>
        <button type="button" data-v="miss" aria-pressed="false" id="setMiss">몰라요만</button>
      </div>
    </div>

    <div class="go"><button class="primary" id="startBtn" type="button" disabled>범위를 골라 주세요</button></div>
  </section>

  <!-- 카드 -->
  <section id="study" hidden style="display:flex;flex-direction:column;flex:1">
    <div class="top">
      <button class="back" id="quitBtn" type="button">‹ 범위</button>
      <div class="tally"><span class="k" id="tK">알아요 0</span><span class="u" id="tU">몰라요 0</span></div>
    </div>
    <div class="prog"><span id="pTxt">1 / 1</span><div class="bar"><i id="pBar"></i></div></div>
    <div class="stage">
      <div class="stamp k" id="stK">알아요</div><div class="stamp u" id="stU">몰라요</div>
      <div class="card" id="card" role="button" tabindex="0" aria-label="카드를 눌러 뒤집기">
        <div class="face front-face">
          <div class="tag"><span id="fTag"></span><button class="say" type="button" aria-label="발음 듣기" data-say><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#14204a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></g></svg></button></div>
          <div class="main" id="fMain"></div>
          <div class="tap">탭해서 뒤집기</div>
        </div>
        <div class="face back-face">
          <div class="tag"><span id="bTag"></span><button class="say" type="button" aria-label="발음 듣기" data-say><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#14204a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></g></svg></button></div>
          <div class="main" id="bMain"></div>
          <div class="tap">← 몰라요 · 밀어서 넘기기 · 알아요 →</div>
        </div>
      </div>
    </div>
    <div class="acts">
      <button class="no" id="noBtn" type="button">몰라요<small>다시 볼게요</small></button>
      <button class="yes" id="yesBtn" type="button">알아요<small>외웠어요</small></button>
    </div>
  </section>

  <!-- 끝 -->
  <section id="done" hidden style="display:flex;flex-direction:column;flex:1">
    <div class="done">
      <div class="hint" id="dRange"></div>
      <div class="big" id="dMsg">한 바퀴 끝!</div>
      <div class="stats">
        <div class="stat k"><b id="dK">0</b><span>알아요</span></div>
        <div class="stat u"><b id="dU">0</b><span>몰라요</span></div>
      </div>
      <div class="misslist" id="missList" hidden></div>
    </div>
    <div class="col">
      <button class="primary" id="againMiss" type="button">몰라요 단어만 다시</button>
      <button class="secondary" id="againAll" type="button">처음부터 다시</button>
      <a class="secondary" id="quizLink" href="#">단어시험 보러 가기 ›</a>
      <button class="secondary" id="toSetup" type="button">범위 다시 고르기</button>
    </div>
  </section>

  <div class="loading" id="loading">단어를 불러오는 중…</div>
  <div class="err" id="err" hidden></div>
</main>

<script src="common.js"></script>
<script>
(function () {
  var KEY = PIF.param('s');
  var LS = 'pifcards:' + KEY;
  var $ = function (id) { return document.getElementById(id); };
  var DATA = [], RANGES = [], sel = {}, opt = { dir: 'ek', ord: 'seq', set: 'all' };
  var deck = [], idx = 0, known = 0, unknownNow = [], flipped = false, lastDeckIds = [];

  $('homeLink').href = 'index.html?s=' + encodeURIComponent(KEY);
  $('quizLink').href = 'quiz.html?s=' + encodeURIComponent(KEY);
  var BOOK = PIF.BOOKS[KEY];
  function setSchool(s) { document.querySelectorAll('.sch').forEach(function (e) { e.textContent = s; }); if (s) document.title = s + ' 카드 단어장 · PIF'; }
  if (BOOK) setSchool(BOOK.school);

  // ---------- 저장 (이 폰에만) ----------
  function load() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } }
  function save(o) { try { localStorage.setItem(LS, JSON.stringify(o)); } catch (e) {} }
  var store = load();
  store.miss = store.miss || {};
  function idOf(r) { return r[0] + '|' + r[1]; }

  // ---------- 데이터 ----------
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function exHtml(ex, mode) {
    var m = /^(.*?)\[(.+?)\](.*)$/.exec(ex);
    if (!m) return esc(ex);
    var mid = mode === 'blank' ? '<span class="blank">' + esc(m[2]) + '</span>' : '<mark>' + esc(m[2]) + '</mark>';
    return esc(m[1]) + mid + esc(m[3]);
  }
  function exPlain(ex) { return String(ex).replace(/[\[\]]/g, ''); }
  function lessonOf(r) { var i = r.indexOf('-'); return i > 0 ? r.slice(0, i) : r; }
  function rangeLabel(r) {
    var i = r.indexOf('-');
    if (i > 0) return '지문 ' + r.slice(i + 1);
    var m = /^P(\d+)$/.exec(r);
    return m ? '지문 ' + m[1] : r;
  }
  function rangeLong(r) { var i = r.indexOf('-'); return i > 0 ? r.slice(0, i) + ' · ' + rangeLabel(r) : rangeLabel(r); }
  // 범위 묶음: '3과-01'처럼 앞부분이 있으면 그것으로 묶고, 'P01'·'Unit 18'처럼 없으면 10개씩 묶음
  function makeGroups() {
    if (RANGES.every(function (r) { return r.indexOf('-') > 0; })) {
      var gs = [];
      RANGES.forEach(function (r) {
        var l = lessonOf(r), g = gs.filter(function (x) { return x.name === l; })[0];
        if (!g) { g = { name: l, items: [] }; gs.push(g); }
        g.items.push(r);
      });
      return gs;
    }
    if (RANGES.length <= 16) return [{ name: '', items: RANGES.slice() }];
    var n = Math.ceil(RANGES.length / Math.ceil(RANGES.length / 10)), out = [];
    for (var k = 0; k < RANGES.length; k += n) {
      var part = RANGES.slice(k, k + n);
      out.push({ name: rangeLabel(part[0]) + ' – ' + rangeLabel(part[part.length - 1]).replace('지문 ', ''), items: part });
    }
    return out;
  }

  function refreshData(rows) {
    DATA = rows; RANGES = [];
    rows.forEach(function (r) { if (RANGES.indexOf(r[0]) < 0) RANGES.push(r[0]); });
    Object.keys(sel).forEach(function (r) { if (RANGES.indexOf(r) < 0) delete sel[r]; });
    if (!$('setup').hidden) buildSetup();
  }
  function start(rows) {
    DATA = rows;
    rows.forEach(function (r) { if (RANGES.indexOf(r[0]) < 0) RANGES.push(r[0]); });
    var last = store.last || {};
    (last.sel || []).forEach(function (r) { if (RANGES.indexOf(r) >= 0) sel[r] = true; });
    if (last.opt) { ['dir', 'ord'].forEach(function (k) { if (last.opt[k]) opt[k] = last.opt[k]; }); }
    $('loading').hidden = true;
    buildSetup();
    show('setup');
  }

  // ---------- 범위 화면 ----------
  function buildSetup() {
    var box = $('lessons'); box.innerHTML = '';
    makeGroups().forEach(function (g) {
      var wrap = document.createElement('div'); wrap.className = 'lesson';
      if (g.name) {
        var head = document.createElement('div'); head.className = 'ln';
        head.innerHTML = '<span>' + esc(g.name) + '</span>';
        var b = document.createElement('button'); b.type = 'button'; b.textContent = g.name.indexOf('–') >= 0 ? '이 묶음 전체' : g.name + ' 전체';
        b.onclick = function () {
          var allOn = g.items.every(function (r) { return sel[r]; });
          g.items.forEach(function (r) { if (allOn) delete sel[r]; else sel[r] = true; });
          refreshSetup();
        };
        head.appendChild(b); wrap.appendChild(head);
      }
      var chips = document.createElement('div'); chips.className = 'chips';
      // 마지막 줄이 덜 비도록 열 수(3~5) 선택
      var cols = [5, 4, 3].map(function (c) { return { c: c, w: (c - g.items.length % c) % c }; })
        .sort(function (a, b) { return a.w - b.w || b.c - a.c; })[0].c;
      chips.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
      if (cols === 5) chips.classList.add('short');
      g.items.forEach(function (r) {
        var c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.dataset.r = r;
        c.onclick = function () { if (sel[r]) delete sel[r]; else sel[r] = true; refreshSetup(); };
        chips.appendChild(c);
      });
      wrap.appendChild(chips); box.appendChild(wrap);
    });
    segBind('dirSeg', 'dir'); segBind('ordSeg', 'ord'); segBind('setSeg', 'set');
    $('allBtn').onclick = function () {
      var allOn = RANGES.every(function (r) { return sel[r]; });
      RANGES.forEach(function (r) { if (allOn) delete sel[r]; else sel[r] = true; });
      refreshSetup();
    };
    refreshSetup();
  }
  function segBind(id, k) {
    var bs = $(id).querySelectorAll('button');
    bs.forEach(function (b) {
      b.onclick = function () { opt[k] = b.dataset.v; refreshSetup(); };
    });
  }
  function missCount(r) { return DATA.filter(function (x) { return x[0] === r && store.miss[idOf(x)]; }).length; }
  function refreshSetup() {
    document.querySelectorAll('.chip').forEach(function (c) {
      var r = c.dataset.r, n = missCount(r);
      c.setAttribute('aria-pressed', sel[r] ? 'true' : 'false');
      var lab = c.parentNode && c.parentNode.classList.contains('short') ? rangeLabel(r).replace('지문 ', '') : rangeLabel(r);
      c.innerHTML = esc(lab) + (n ? '<span class="cnt" aria-label="몰라요 ' + n + '개">' + n + '</span>' : '');
    });
    var picked = RANGES.filter(function (r) { return sel[r]; });
    $('allBtn').textContent = RANGES.every(function (r) { return sel[r]; }) ? '전체 해제' : '전체 선택';
    var words = DATA.filter(function (x) { return sel[x[0]]; });
    var miss = words.filter(function (x) { return store.miss[idOf(x)]; }).length;
    $('setMiss').textContent = '몰라요만 (' + miss + ')';
    $('setMiss').disabled = miss === 0;
    if (miss === 0 && opt.set === 'miss') opt.set = 'all';
    ['dirSeg', 'ordSeg', 'setSeg'].forEach(function (id) {
      var k = { dirSeg: 'dir', ordSeg: 'ord', setSeg: 'set' }[id];
      $(id).querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === opt[k] ? 'true' : 'false'); });
    });
    var n = opt.set === 'miss' ? miss : words.length;
    var sb = $('startBtn');
    sb.disabled = !picked.length || !n;
    sb.textContent = picked.length ? n + '개 카드 시작' : '범위를 골라 주세요';
  }
  $('startBtn').onclick = function () {
    var words = DATA.filter(function (x) { return sel[x[0]]; });
    if (opt.set === 'miss') words = words.filter(function (x) { return store.miss[idOf(x)]; });
    store.last = { sel: Object.keys(sel), opt: { dir: opt.dir, ord: opt.ord } }; save(store);
    begin(words);
  };

  // ---------- 카드 ----------
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function begin(words) {
    deck = opt.ord === 'shuf' ? shuffle(words) : words.slice();
    lastDeckIds = deck.map(idOf);
    idx = 0; known = 0; unknownNow = [];
    show('study'); render(false);
  }
  function relHtml(r) {
    var h = '';
    if (r[4]) h += '<div class="s"><i>=</i><span>' + esc(r[4]) + '</span></div>';
    if (r[5]) h += '<div class="a"><i>↔</i><span>' + esc(r[5]) + '</span></div>';
    return h ? '<div class="rel">' + h + '</div>' : '';
  }
  function render(animate) {
    var card = $('card');
    card.classList.add('nofx'); card.classList.remove('flip'); flipped = false;
    void card.offsetWidth; card.classList.remove('nofx');
    card.style.transform = '';
    var r = deck[idx];
    var tag = rangeLong(r[0]);
    $('fTag').textContent = tag; $('bTag').textContent = tag;
    var wcls = r[1].length > 14 ? 'w sm' : 'w';
    if (opt.dir === 'ek') {
      $('fMain').innerHTML = '<div class="' + wcls + '">' + esc(r[1]) + '</div>' + (r[3] ? '<div class="ex">' + exHtml(r[3]) + '</div>' : '');
      $('bMain').innerHTML = '<div class="ko">' + esc(r[2]) + '</div>' + relHtml(r) + '<div class="hint" style="font-family:Lora,serif;font-size:15px">' + esc(r[1]) + '</div>';
    } else {
      $('fMain').innerHTML = '<div class="ko">' + esc(r[2]) + '</div>' + (r[3] ? '<div class="ex">' + exHtml(r[3], 'blank') + '</div>' : '');
      $('bMain').innerHTML = '<div class="' + wcls + '">' + esc(r[1]) + '</div>' + relHtml(r) + (r[3] ? '<div class="ex">' + exHtml(r[3]) + '</div>' : '');
    }
    // 뒷면(한→영) 단어 쪽 발음 버튼은 정답이 나올 때만 의미 있으므로 앞면 발음은 영→한일 때만 표시
    document.querySelector('.front-face [data-say]').style.visibility = opt.dir === 'ek' ? 'visible' : 'hidden';
    $('pTxt').textContent = (idx + 1) + ' / ' + deck.length;
    $('pBar').style.width = (idx / deck.length * 100) + '%';
    $('tK').textContent = '알아요 ' + known; $('tU').textContent = '몰라요 ' + unknownNow.length;
  }
  function flip() { flipped = !flipped; $('card').classList.toggle('flip', flipped); }
  function mark(ok) {
    var r = deck[idx]; if (!r) return;
    var id = idOf(r);
    if (ok) { known++; delete store.miss[id]; } else { unknownNow.push(r); store.miss[id] = 1; }
    save(store);
    stamp(ok);
    idx++;
    if (idx >= deck.length) { $('pBar').style.width = '100%'; setTimeout(finish, 180); }
    else render(true);
  }
  function stamp(ok) {
    var s = $(ok ? 'stK' : 'stU');
    s.style.transition = 'none'; s.style.opacity = 1;
    requestAnimationFrame(function () { s.style.transition = 'opacity .5s'; s.style.opacity = 0; });
  }

  // 탭 = 뒤집기, 좌우로 밀기 = 몰라요/알아요
  var card = $('card'), sx = 0, sy = 0, dx = 0, drag = false, moved = false;
  card.addEventListener('pointerdown', function (e) {
    if (e.target.closest('[data-say]')) return;
    drag = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0;
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    dx = e.clientX - sx;
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - sy)) {
      moved = true;
      card.classList.add('nofx');
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 18 + 'deg)' + (flipped ? ' rotateY(180deg)' : '');
      $('stK').style.opacity = dx > 0 ? Math.min(dx / 120, 1) : 0;
      $('stU').style.opacity = dx < 0 ? Math.min(-dx / 120, 1) : 0;
    }
  });
  window.addEventListener('pointerup', function (e) {
    if (!drag) return; drag = false;
    card.classList.remove('nofx');
    $('stK').style.opacity = 0; $('stU').style.opacity = 0;
    if (moved && Math.abs(dx) > 90) { mark(dx > 0); return; }
    card.style.transform = '';
    if (!moved && !e.target.closest('[data-say]')) flip();
  });
  card.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
  $('yesBtn').onclick = function () { mark(true); };
  $('noBtn').onclick = function () { mark(false); };
  $('quitBtn').onclick = function () { refreshSetup(); show('setup'); };

  // 발음
  var voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices();
    voice = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang); })[0] || vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  document.querySelectorAll('[data-say]').forEach(function (b) {
    if (!('speechSynthesis' in window)) { b.style.display = 'none'; return; }
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var r = deck[idx]; if (!r) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(r[1].replace(/one's/g, "one's"));
      u.lang = 'en-US'; u.rate = 0.9; if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    });
  });

  // ---------- 끝 ----------
  function finish() {
    var u = unknownNow.length;
    $('dK').textContent = known; $('dU').textContent = u;
    $('dMsg').textContent = u ? '한 바퀴 끝! 몰라요 ' + u + '개' : '전부 알아요! 완벽해요';
    $('dRange').textContent = RANGES.filter(function (r) { return sel[r]; }).map(rangeLong).join(', ');
    var ml = $('missList');
    if (u) {
      ml.innerHTML = unknownNow.map(function (r) { return '<div><b>' + esc(r[1]) + '</b><span>' + esc(r[2]) + '</span></div>'; }).join('');
      ml.hidden = false;
    } else ml.hidden = true;
    $('againMiss').hidden = !u;
    show('done');
  }
  $('againMiss').onclick = function () { begin(unknownNow.slice()); };
  $('againAll').onclick = function () {
    var ids = {}; lastDeckIds.forEach(function (i) { ids[i] = 1; });
    begin(DATA.filter(function (x) { return ids[idOf(x)]; }));
  };
  $('toSetup').onclick = function () { refreshSetup(); show('setup'); };

  function show(id) {
    ['setup', 'study', 'done'].forEach(function (s) { $(s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }

  function fail(e) {
    $('loading').hidden = true;
    $('err').hidden = false;
    $('err').textContent = '단어를 불러오지 못했어요. 잠시 후 새로고침해 주세요. (' + (e && e.message ? e.message : e) + ')';
  }
  if (!KEY) { fail('QR 주소가 올바르지 않아요'); return; }
  // 한 번 불러온 단어는 폰에 보관해 두고 바로 보여 준 뒤, 서버의 최신 단어로 조용히 바꿉니다.
  var CK = 'pifcardsdata:' + KEY, shown = false;
  try { var c = JSON.parse(localStorage.getItem(CK) || 'null'); if (c && c.rows && c.rows.length) { if (c.school) setSchool(c.school); start(c.rows); shown = true; } } catch (e) {}
  PIF.get({ api: 'cards', key: KEY }).then(function (d) {
    if (d.school) setSchool(d.school);
    try { localStorage.setItem(CK, JSON.stringify({ rows: d.rows, school: d.school, t: Date.now() })); } catch (e) {}
    if (!shown) start(d.rows);
    else if (JSON.stringify(d.rows) !== JSON.stringify(DATA)) { refreshData(d.rows); }
  }).catch(function (e) { if (!shown) fail(e); });
})();
</script>
</body>
</html>
