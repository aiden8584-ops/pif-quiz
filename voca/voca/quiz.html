<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어시험 · PIF</title>
<meta name="theme-color" content="#fdf7f2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Lora:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#fdf7f2; --card:#ffffff; --ink:#1d2233; --sub:#5d6276; --line:#e9e3dc;
  --accent:#14204a; --accent-soft:#eef1f8; --or:#f15a1f; --or-soft:#fff1ea;
  --ok:#12806f; --ok-soft:#e4f4f0; --bad:#d0531f; --bad-soft:#fdeee6;
  --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;padding:18px 18px 40px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:13px;color:var(--accent);font-weight:700}
.brand b{font-weight:900}
.brand a{color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding-right:8px}
h1{word-break:keep-all;margin:4px 0 0;font-size:22px;line-height:1.35;font-weight:900;letter-spacing:-.5px;color:var(--accent)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 18px rgba(20,32,74,.05)}
.lbl{font-size:13px;font-weight:700;color:var(--sub)}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:48px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:700;padding:0 14px;min-height:40px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.ghost{border-style:solid;background:#f4efe9;border-color:#f4efe9;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.p{font:inherit;font-size:15px;font-weight:700;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.p.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{font-size:13px;color:var(--sub)}
.btn{font:inherit;font-size:18px;font-weight:900;letter-spacing:-.3px;min-height:56px;padding:0 16px;border-radius:16px;border:0;background:var(--accent);color:#fff;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn:disabled{background:#b9bccb;cursor:default}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--line);font-size:16px;font-weight:700;min-height:52px}
.btn.or{background:#fff;color:var(--or);border:2px solid var(--or);font-size:16px;font-weight:700;min-height:52px}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #9fb0e0;outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.top #timer{color:var(--sub);font-weight:500}
.top .bar{flex:1}
body.inquiz .brand,body.inquiz .foot{display:none}
body.inquiz .wrap{padding-top:14px;gap:12px}
.qcard{gap:12px;padding:18px 18px 16px;border-radius:22px;box-shadow:0 10px 28px rgba(20,32,74,.08)}
.qhead{display:flex;justify-content:space-between;align-items:center}
.ansrow{display:flex;gap:8px;align-items:stretch;margin:2px 0 0}
.ansrow input{flex:1;min-width:0;padding:10px 12px}
.nextbtn{width:auto;flex:none;padding:0 18px;font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{height:6px;background:#ebe4dc;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--or));width:0;transition:width .25s}
.qtype{font-size:12px;font-weight:700;color:var(--or);background:var(--or-soft);border-radius:999px;padding:4px 10px}
.prompt{font-size:26px;font-weight:900;line-height:1.35;word-break:keep-all;letter-spacing:-.5px;text-align:center;padding:6px 0}
.prompt.en{font-family:var(--serif)}
.sent{font-family:var(--serif);font-size:17px;line-height:1.6;color:#464b5f;background:#faf7f3;border-radius:12px;padding:12px 14px}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--or);margin:0 2px}
.src{font-size:12px;font-weight:700;color:var(--sub);background:#f4efe9;border-radius:999px;padding:4px 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;font-size:17px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;line-height:1.4}
.opt.en{font-family:var(--serif)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.big{font-size:48px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-1px}
.stat{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.save{font-size:14px;padding:10px 12px;border-radius:12px}
.save.ok{background:var(--ok-soft);color:var(--ok)}
.save.bad{background:var(--bad-soft);color:var(--bad)}
.save.wait{background:var(--accent-soft);color:var(--accent)}
.wrong{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:3px}
.wrong .w{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--accent)}
.wrong .w .src{font-family:var(--sans);font-size:11px;margin-left:4px;vertical-align:2px;display:inline-block;white-space:nowrap}
.wrong .m{font-size:15px}
.wrong .you{font-size:13px;color:var(--bad)}
.wrong .ex{font-family:var(--serif);font-size:14px;color:var(--sub);line-height:1.5}
.wrong .ex b{color:var(--accent);background:#ffe3d4;border-radius:3px;padding:0 2px}
.foot{font-size:11px;color:#9a9db0;text-align:center}
.pat{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:22px;font-weight:700;padding:4px 0}
.pat .word{display:inline-flex;flex-wrap:nowrap;gap:.18em;align-items:center}
.pat .slot{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:1.3em;height:1.6em;border:1.5px solid var(--line);border-radius:.3em;background:#fff;color:var(--ink);text-transform:lowercase}
.pat .slot.hl{color:#a8acbf;background:#faf7f3}
.pat .slot.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pat .slot.cur{border-color:var(--or);box-shadow:0 0 0 2px rgba(241,90,31,.16)}
.pat .slot.cur::after{content:"";position:absolute;left:22%;right:22%;bottom:.2em;height:2px;background:var(--or);border-radius:1px;animation:blink 1s steps(1) infinite}
.pat .slot.pop{animation:pop .07s ease-out}
@keyframes blink{50%{opacity:0}}
@keyframes pop{0%{transform:scale(.94)}100%{transform:scale(1)}}
.pat .sep{color:var(--sub);font-weight:500}
.pat .fx{font-family:var(--sans);font-size:14px;color:var(--sub);font-weight:500;background:#f4efe9;border-radius:6px;padding:3px 7px}
.sblank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--or);margin:0 2px;padding:0 3px;color:var(--accent);font-weight:700;line-height:1.25;text-align:center}
.sblank.empty{color:transparent}
.pbar{display:grid;grid-template-columns:4.4em minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.pbar .lab{font-weight:700;color:var(--sub)}
.pbar .track{height:10px;background:#ebe4dc;border-radius:5px;overflow:hidden}
.pbar .track i{display:block;height:100%;border-radius:5px}
.pbar .num{text-align:right;color:var(--sub)}
.pbars{display:flex;flex-direction:column;gap:8px}
.cnt{font-size:13px;color:var(--sub);text-align:center}
.cnt b{color:var(--accent)}
.over{color:var(--bad);font-weight:700}
.mean{font-size:14px;color:var(--sub)}
.mean b{color:var(--ink)}
#spell{font-family:var(--serif);font-size:20px}
#spellLbl{text-align:center;font-size:12px}
[hidden]{display:none!important}
/* 화면 키보드: 폰 키보드를 띄우지 않아 자동완성·추천 단어가 나오지 않음 */
body.inquiz .wrap{padding-bottom:calc(var(--kbh,300px) + 16px)}
.kb{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#efe9e2;border-top:1px solid var(--line);padding:10px max(4px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:9px;user-select:none;-webkit-user-select:none}
.kb .krow{display:flex;gap:5px;justify-content:center;max-width:560px;width:100%;margin:0 auto}
.kb .k{flex:1;max-width:46px;height:56px;border:0;border-radius:9px;background:#fff;color:var(--ink);font-family:var(--serif);font-size:21px;font-weight:600;box-shadow:0 1px 0 rgba(20,32,74,.18);touch-action:manipulation;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.kb .k:active,.kb .k.down{background:#e3ddd5;transform:translateY(1px)}
.kb .k.wide{max-width:none;flex:1.6;font-family:var(--sans);font-size:16px;font-weight:700}
.kb .k.go{flex:3;max-width:none;background:var(--accent);color:#fff;font-family:var(--sans);font-size:17px;font-weight:900}
.kb .k.go:disabled{background:#b9bccb;cursor:default}
.kb .k.hintkey{flex:2;max-width:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;background:transparent;box-shadow:none;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--sub);cursor:default}
.prompt.long{font-size:20px;line-height:1.45}
.kb .k.skip{flex:1.4;background:#fff;box-shadow:inset 0 0 0 2px var(--or);color:var(--or);font-weight:900}
.pat .free{font-family:var(--serif);font-size:24px;letter-spacing:.02em;color:var(--accent);word-break:break-all}
.pat .free .ph{font-family:var(--sans);font-size:15px;color:#a8acbf;font-weight:500}
.pat .caret{display:inline-block;width:2px;height:1.1em;background:var(--or);margin-left:2px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
body.inquiz #quiz{min-height:calc(100vh - var(--kbh,300px) - 40px);min-height:calc(100dvh - var(--kbh,300px) - 40px)}
/* 문제 카드가 키보드 위 빈 공간을 모두 채우고, 내용은 가운데 */
body.inquiz .qcard{margin-top:0;flex:1;padding:20px 18px 18px}
body.inquiz #qbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:8px 0}
body.inquiz .prompt{font-size:32px;line-height:1.3}
body.inquiz .prompt.long{font-size:23px}
body.inquiz .sent{font-size:19px}
body.inquiz .cnt{font-size:14px}
body.inquiz #spellLbl{font-size:12.5px;line-height:1.5}
select{width:100%;font:inherit;font-size:17px;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat}
select:focus{outline:none;border-color:var(--accent)}
.hwinfo{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.hwinfo span{color:var(--sub);font-size:13px;font-weight:700;padding-top:2px}
.hwinfo b{font-weight:700;word-break:keep-all}
.warn{font-size:13px;color:var(--bad)}
.notice{font-size:12px;color:var(--sub);text-align:center}
.sub2{font-size:13px;color:var(--sub)}
.rtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rtile{background:#faf7f3;border-radius:14px;padding:12px;text-align:center}
.rtile b{display:block;font-size:26px;font-weight:900}
.rtile span{font-size:12px;color:var(--sub)}
.rtile.ok b{color:var(--ok)} .rtile.bad b{color:var(--or)}
.cardnote{font-size:12px;color:var(--sub);text-align:center;margin-top:-6px}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}.pat .slot.pop{animation:none}.pat .slot.cur::after,.pat .caret{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><a id="backHome" href="#" hidden>‹ 처음으로</a><span id="brandPif">PIF ENGLISH ACADEMY</span><span>결국, <span id="schName">○○고</span> 영어는 <b>주찬솔</b></span></div>

  <!-- 1. 설정 -->
  <section id="setup" class="wrap" style="padding:0">
    <h1 id="qTitle">단어시험</h1>
    <div class="card">
      <label class="lbl" for="name">이름</label>
      <select id="nameSel" hidden aria-label="이름 고르기"></select>
      <input id="name" type="text" placeholder="이름을 입력하세요" autocomplete="off" maxlength="20">
    </div>
    <div class="card" id="hwCard" hidden>
      <div class="lbl">숙제 시험 <span class="hint">· 선생님이 정한 조건</span></div>
      <div class="hwinfo" id="hwInfo"></div>
      <div class="warn" id="hwWarn" hidden></div>
    </div>
    <div class="card" id="rangeCard">
      <div class="lbl">시험 범위 <span id="rangeInfo" class="hint"></span></div>
      <div class="row" id="quick">
        <span class="hint" id="loading">단어 불러오는 중…</span>
      </div>
      <div class="grid" id="pgrid"></div>
    </div>
    <div class="card" id="optCard">
      <div class="lbl">문제 유형</div>
      <div class="row" id="types">
        <button class="chip on" data-t="mix">섞어서</button>
        <button class="chip" data-t="s">스펠링 (뜻 보고 쓰기)</button>
        <button class="chip" data-t="x">예문 빈칸 쓰기</button>
      </div>
      <div class="lbl">문항 수</div>
      <div class="row" id="counts">
        <button class="chip" data-n="20">20</button>
        <button class="chip on" data-n="30">30</button>
        <button class="chip" data-n="50">50</button>
        <button class="chip" data-n="0">범위 전체</button>
      </div>
    </div>
    <button id="start" class="btn" disabled>시험 시작</button>
    <div class="hint" id="startHint">이름을 입력하고 범위를 1개 이상 고르세요.</div>
    <div class="notice">시험 중 다른 앱이나 탭으로 나가면 그 횟수가 선생님께 기록됩니다.</div>
  </section>

  <!-- 2. 시험 -->
  <section id="quiz" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="top"><span id="qnum"></span><div class="bar"><i id="prog"></i></div><span id="timer">0:00</span></div>
    <div class="card qcard">
      <div class="qhead"><span class="qtype" id="qtype"></span><span class="src" id="qsrc"></span></div>
      <div id="qbody"></div>
      <div class="hint" id="spellLbl"></div>
      <form id="ansForm" class="kb" autocomplete="off" aria-label="화면 키보드">
        <input id="spell" type="hidden" value="">
        <div class="krow"><button type="button" class="k" data-k="q">q</button><button type="button" class="k" data-k="w">w</button><button type="button" class="k" data-k="e">e</button><button type="button" class="k" data-k="r">r</button><button type="button" class="k" data-k="t">t</button><button type="button" class="k" data-k="y">y</button><button type="button" class="k" data-k="u">u</button><button type="button" class="k" data-k="i">i</button><button type="button" class="k" data-k="o">o</button><button type="button" class="k" data-k="p">p</button></div>
        <div class="krow"><button type="button" class="k" data-k="a">a</button><button type="button" class="k" data-k="s">s</button><button type="button" class="k" data-k="d">d</button><button type="button" class="k" data-k="f">f</button><button type="button" class="k" data-k="g">g</button><button type="button" class="k" data-k="h">h</button><button type="button" class="k" data-k="j">j</button><button type="button" class="k" data-k="k">k</button><button type="button" class="k" data-k="l">l</button></div>
        <div class="krow"><button type="button" class="k" data-k="z">z</button><button type="button" class="k" data-k="x">x</button><button type="button" class="k" data-k="c">c</button><button type="button" class="k" data-k="v">v</button><button type="button" class="k" data-k="b">b</button><button type="button" class="k" data-k="n">n</button><button type="button" class="k" data-k="m">m</button><button type="button" class="k wide" id="del" aria-label="한 글자 지우기">⌫</button></div>
        <div class="krow"><button type="button" class="k wide skip" id="skip">모름</button><span class="k hintkey" id="autoHint">띄어쓰기 자동</span><button type="button" class="k wide" data-k=" " id="kSpace" hidden aria-label="띄어쓰기">space</button><button type="button" class="k" data-k="-" id="kHyph" hidden>-</button><button type="button" class="k" data-k="'" id="kApos" hidden>'</button><button id="next" class="k go" type="submit" disabled>다음</button></div>
      </form>
    </div>
  </section>

  <!-- 3. 결과 -->
  <section id="result" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <div class="lbl" id="rName"></div>
      <div class="stat"><span class="big" id="rScore"></span><span id="rTime" class="hint"></span></div>
      <div class="rtiles"><div class="rtile ok"><b id="rOk">0</b><span>맞음</span></div><div class="rtile bad"><b id="rNg">0</b><span>틀림 · 모름</span></div></div>
      <div class="sub2" id="rExtra"></div>
      <div class="save wait" id="rSave">결과 저장 중…</div>
    </div>
    <div class="card" id="passCard">
      <div class="lbl">범위별 정답률 <span class="hint">· 낮은 범위는 단어장에서 다시 보기</span></div>
      <div class="pbars" id="pbars"></div>
    </div>
    <div class="card" id="wrongCard">
      <div class="lbl" id="wrongTitle"></div>
      <div id="wrongList"></div>
    </div>
    <a id="toCards" class="btn or" href="#" hidden>틀린 단어 카드로 복습 ›</a>
    <div class="cardnote" id="cardNote" hidden>틀린 단어가 카드 단어장의 ‘몰라요’에 추가됐어요</div>
    <button id="retry" class="btn">틀린 문제 다시 풀기 (기록 안 됨)</button>
    <button id="home" class="btn sec">시험 처음으로</button>
  </section>

  <div class="foot">Copyright © PIF English Academy</div>
</div>

<script src="common.js"></script>
<script>
// 주소: quiz.html?s=seocho1 (일반 시험) 또는 quiz.html?hw=숙제코드 (숙제 시험)
var KEY = PIF.param('s'), HW = PIF.param('hw');
var TAB = '';
// 숙제 링크(?hw=코드)로 열면 선생님이 정한 조건, 아니면 null
var PRESET = null;   // 서버에서 받아 온 뒤 채워짐
var HINT = (PRESET && PRESET.hint) || 'full';   // full: 첫 글자+글자 수 · len: 글자 수만 · none: 힌트 없음
var HINT_NAME = {full:'첫 글자+글자 수', len:'글자 수만', none:'없음'};
var TYPE_SET_NAME = {mix:'섞어서', s:'스펠링', x:'예문 빈칸'};
var W = [];        // 시트에서 불러온 단어 {p, w, k, pre, hit, post}
var RANGES = [];   // 범위 목록 (시트에 나온 순서대로)
// 예문 칸: "When someone [cuts you off] on the highway" → 대괄호 안이 정답
function parseRow(r,i){
  var m=/^([\s\S]*?)\[([^\]]+)\]([\s\S]*)$/.exec(r[3]||'');
  return {i:i,p:r[0]||'기타',w:r[1],k:r[2],pre:m?m[1]:'',hit:m?m[2].trim():'',post:m?m[3]:''};
}
var TYPE_NAME = {s:'스펠링 · 뜻 보고 쓰기',x:'예문 빈칸 쓰기'};

var state = {sel:{}, type:'mix', n:30};
var quiz = null;

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();}
// 구문 속 자리 표시(~, A, B, -ing, one's, oneself)는 힌트에 그대로 보여 주고 채점에서는 빼고 비교
var FIXED = {'~':1,'a':1,'b':1,'-ing':1,"one's":1,'oneself':1};
function isFixed(tok, headword){
  var t=norm(tok);
  if(!FIXED[t]) return false;
  if(t==='a'||t==='b') return /\bA\b|\bB\b/.test(headword); // supply A with B 같은 경우만
  return true;
}
function key(s, headword){
  return norm(s).replace(/[.,!?;:"“”]+$/,'').split(' ')
    .filter(function(t){return t && !isFixed(t, headword||'');}).join(' ')
    .replace(/([a-z])\s*-\s*([a-z])/g,'$1-$2');
}
function letters(s){return (s.match(/[a-zA-Z]/g)||[]).length;}
// 첫 글자 + 글자 수 힌트. 입력한 철자가 칸에 차례로 채워진다.
var lastUsed=0;
function hintHTML(s, headword, typed){
  var hw=headword||'';
  var got=(key(typed||'', hw).match(/[a-z]/gi)||[]);   // 자리 표시(A, B, ~ 등)는 빼고 알파벳만
  var n=0;
  var html=s.split(' ').map(function(tok){
    if(isFixed(tok, hw)) return '<span class="fx">'+esc(tok)+'</span>';
    var out='', first=true;
    for(var i=0;i<tok.length;i++){
      var c=tok.charAt(i);
      if(/[a-zA-Z]/.test(c)){
        var g=got[n], cls='slot';
        if(g) cls+=' on'+(n===got.length-1 && got.length>lastUsed ? ' pop' : '');
        else if(first && HINT==='full') cls+=' hl';
        if(n===got.length) cls+=' cur';
        out+='<span class="'+cls+'">'+(g ? esc(g) : (first && HINT==='full') ? esc(c) : '')+'</span>';
        n++;
        first=false;
      } else { out+='<span class="sep">'+esc(c)+'</span>'; if(c==='-') first=true; }
    }
    return '<span class="word">'+out+'</span>';
  }).join('');
  return {html:html, count:n, used:got.length};
}
// 힌트 없음: 칸 대신 친 글자만 보여 줌 (글자 수·띄어쓰기 위치를 알려 주지 않음)
function patHTML(q, typed){
  if(HINT==='none'){
    return {free:true, count:40, used:typed.length,
      html:'<span class="free">'+(typed ? esc(typed) : '<span class="ph">철자를 입력하세요</span>')+'</span><span class="caret"></span>'};
  }
  return hintHTML(q.answer, q.o.w, typed);
}
function countHTML(h){
  if(h.free) return '';
  if(h.used>h.count) return '<span class="over">'+h.count+'칸보다 '+(h.used-h.count)+'글자 많아요</span>';
  return '<b>'+h.used+'</b> / '+h.count+' 글자';
}
// 같은 뜻을 가진 표제어끼리는 서로 정답 인정
var SAME_MEANING = {};
function canBlank(o){ return !!o.hit && o.hit.split(' ').length<=4; }

// ---------- 설정 화면 ----------
var pg = $('pgrid');
function label(p){ return /^P\d+$/.test(p) ? p.slice(1) : /^Unit \d+$/.test(p) ? p.slice(5) : p; }
function setSel(list){ state.sel={}; list.forEach(function(p){state.sel[p]=true;}); refresh(); }
function quickChip(text, list){
  var b=document.createElement('button'); b.className='chip ghost'; b.type='button'; b.textContent=text;
  b.addEventListener('click',function(){ setSel(list); });
  $('quick').appendChild(b);
}
function init(rows){
  W = rows.map(parseRow);
  SAME_MEANING = {};
  W.forEach(function(o){ var k=norm(o.k); (SAME_MEANING[k]=SAME_MEANING[k]||{})[key(o.w,o.w)]=1; });
  RANGES=[]; W.forEach(function(o){ if(RANGES.indexOf(o.p)<0) RANGES.push(o.p); });
  $('quick').innerHTML='';
  quickChip('전체', RANGES);
  // "3과-01"처럼 앞부분이 같은 범위는 그 앞부분(3과, 4과 …)으로 묶음 버튼을 만든다
  var groups={}, order=[];
  RANGES.forEach(function(p){ var i=p.indexOf('-'); if(i>0){ var g=p.slice(0,i); if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(p); } });
  if(order.length>1 && order.reduce(function(n,g){return n+groups[g].length;},0)===RANGES.length){
    order.forEach(function(g){ quickChip(g, groups[g]); });
  } else if(RANGES.length>10){
    // 10개 안팎으로 고르게 나눔 (11개 → 6·5, 14개 → 7·7)
    var size=Math.ceil(RANGES.length/Math.ceil(RANGES.length/10));
    for(var s=0;s<RANGES.length;s+=size){
      var part=RANGES.slice(s,s+size);
      quickChip(part.length>1 ? part[0]+'–'+part[part.length-1] : part[0], part);
    }
  }
  quickChip('선택 해제', []);
  pg.innerHTML='';
  RANGES.forEach(function(p){
    var b=document.createElement('button');
    b.className='p'; b.type='button'; b.textContent=label(p); b.dataset.p=p; b.setAttribute('aria-label',p);
    pg.appendChild(b);
  });
  // 짧은 번호(01, 02 …)만 있으면 5칸, 아니면 3칸
  var short=RANGES.every(function(p){ return label(p).length<=3; });
  pg.style.gridTemplateColumns='repeat('+(short?5:3)+', minmax(0, 1fr))';
  applyPreset();
  refresh();
}
// 숙제 링크: 범위·유형·문항 수를 선생님 설정으로 고정하고 고르는 화면은 숨김
function applyPreset(){
  if(!PRESET) return;
  var want = PRESET.ranges && PRESET.ranges.length ? PRESET.ranges : RANGES.slice();
  var have = want.filter(function(p){ return RANGES.indexOf(p)>=0; });
  var miss = want.filter(function(p){ return RANGES.indexOf(p)<0; });
  setSel(have);
  state.type=PRESET.type; state.n=PRESET.n;
  $('rangeCard').hidden=true; $('optCard').hidden=true; $('hwCard').hidden=false;
  var cnt=pool().length, n = state.n>0 ? Math.min(state.n,cnt) : cnt;
  var rows=[['범위', have.length===RANGES.length ? '전체' : have.join(', ')],
            ['유형', TYPE_SET_NAME[state.type]], ['문항', n+'문항'], ['힌트', HINT_NAME[HINT]]];
  $('hwInfo').innerHTML=rows.map(function(r){return '<span>'+r[0]+'</span><b>'+esc(r[1])+'</b>';}).join('');
  if(miss.length){ $('hwWarn').hidden=false; $('hwWarn').textContent='시트에 없는 범위는 빠졌습니다: '+miss.join(', '); }
}
pg.addEventListener('click',function(ev){
  var b=ev.target.closest('.p'); if(!b) return;
  state.sel[b.dataset.p]=!state.sel[b.dataset.p]; refresh();
});
function setHead(school, title){
  if(school){ $('schName').textContent=school; }
  if(title){ $('qTitle').textContent=title; document.title=title+' · PIF'; }
}
function loadWords(){
  if(!KEY && !HW){ $('loading').textContent='QR 주소가 올바르지 않아요. 선생님께 다시 받아 주세요.'; return; }
  var B=PIF.BOOKS[KEY]; if(B) setHead(B.school, '');
  PIF.get(HW ? {api:'quiz', hw:HW} : {api:'quiz', key:KEY}).then(function(d){
    var rows=d && d.rows;
    if(!rows || !rows.length){ $('loading').textContent='시트에 단어가 없습니다.'; return; }
    KEY=d.key; TAB=d.tab; PRESET=d.preset||null; HINT=(PRESET && PRESET.hint) || 'full';
    setHead(d.school, d.title);
    setNav();
    setRoster(d.names);
    init(rows);
  }).catch(function(err){
    var m=String(err && err.message || err);
    $('loading').textContent = /[가-힣]/.test(m) ? m : '단어를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요. ('+m+')';
  });
}
function pick(groupId,attr,key){
  $(groupId).addEventListener('click',function(ev){
    var b=ev.target.closest('.chip'); if(!b) return;
    $(groupId).querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b);});
    state[key]= key==='n' ? parseInt(b.dataset[attr],10) : b.dataset[attr];
  });
}
pick('types','t','type'); pick('counts','n','n');
$('name').addEventListener('input',refresh);
$('nameSel').addEventListener('change',function(){
  var other=this.value==='__other';
  $('name').hidden=!other; if(other) $('name').focus();
  refresh();
});
var savedName=''; try{ savedName=localStorage.getItem('vmname')||''; if(savedName) $('name').value=savedName; }catch(e){}
function getName(){
  var s=$('nameSel');
  if(!s.hidden && s.value && s.value!=='__other') return s.value;
  return $('name').value.trim();
}
// 반 명단이 있으면 목록에서 고르기 (명단에 없으면 직접 입력)
function setRoster(names){
  if(!names || !names.length) return;
  var s=$('nameSel');
  s.innerHTML='<option value="">이름을 고르세요</option>'+names.map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+'<option value="__other">명단에 없음 (직접 입력)</option>';
  s.hidden=false;
  if(savedName && names.indexOf(savedName)>=0){ s.value=savedName; $('name').hidden=true; }
  else { $('name').hidden=true; $('name').value=''; }
  refresh();
}

function pool(){return W.filter(function(o){return state.sel[o.p];});}
function refresh(){
  pg.querySelectorAll('.p').forEach(function(b){b.classList.toggle('on',!!state.sel[b.dataset.p]);});
  var c=pool().length, k=Object.keys(state.sel).filter(function(x){return state.sel[x];}).length;
  $('rangeInfo').textContent = k ? '· 범위 '+k+'개, 단어 '+c+'개' : '';
  var ok = getName().length>0 && c>0;
  $('start').disabled=!ok;
  $('startHint').hidden=ok;
  if(PRESET) $('startHint').textContent='이름을 입력하세요.';
}
refresh();
loadWords();

// ---------- 카드 단어장 연결 (시작 화면 링크 · 틀린 단어 → 카드 '몰라요') ----------
var NAV=null;
function setNav(){
  if(!KEY) return;
  NAV={key:KEY};
  $('backHome').href='index.html?s='+encodeURIComponent(KEY); $('backHome').hidden=false; $('brandPif').hidden=true;
  $('toCards').href='cards.html?s='+encodeURIComponent(KEY);
}
if(KEY) setNav();
function sendToCards(wrong){
  if(!NAV || !wrong.length) return false;
  try{
    var k='pifcards:'+NAV.key, st=JSON.parse(localStorage.getItem(k)||'{}');
    st.miss=st.miss||{};
    wrong.forEach(function(a){ st.miss[a.q.o.p+'|'+a.q.o.w]=1; });
    localStorage.setItem(k, JSON.stringify(st));
    return true;
  }catch(e){ return false; }
}

// ---------- 문제 만들기 ----------
function makeQ(o,t){
  if(t==='x' && !canBlank(o)) t='s';
  var q={o:o,t:t};
  if(t==='s'){ q.answer=o.w; q.accept=SAME_MEANING[norm(o.k)]; }
  else { q.answer=o.hit; q.accept={}; q.accept[key(o.hit,o.w)]=1; }
  return q;
}
function buildQuiz(list){
  var types=['s','x'];
  var qs=list.map(function(o,i){
    var t= state.type==='mix' ? types[i%2] : state.type;
    return makeQ(o,t);
  });
  return shuffle(qs);
}
function grade(q, given){
  var hw = q.t==='s' ? q.o.w : q.o.w;
  return !!q.accept[key(given, hw)];
}

// ---------- 시험 진행 ----------
var tick=null;
function startQuiz(list, record){
  var chosen=RANGES.filter(function(p){return state.sel[p];});
  quiz={qs:buildQuiz(list), i:0, ans:[], t0:Date.now(), record:record, leaves:0,
        ranges: chosen.length===RANGES.length ? '전체' : chosen.join(', ')};
  $('autoHint').hidden = HINT==='none';
  ['kSpace','kHyph','kApos'].forEach(function(id){ $(id).hidden = HINT!=='none'; });
  $('setup').hidden=true; $('result').hidden=true; $('quiz').hidden=false; document.body.classList.add('inquiz');
  clearInterval(tick); tick=setInterval(showTime,1000); showTime();
  show();
  window.scrollTo(0,0);
}
function showTime(){
  var s=Math.floor((Date.now()-quiz.t0)/1000);
  $('timer').textContent=Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
}
function show(){
  var q=quiz.qs[quiz.i], o=q.o, total=quiz.qs.length;
  $('next').disabled=true;
  $('qnum').textContent=(quiz.i+1)+' / '+total;
  $('prog').style.width=(quiz.i/total*100)+'%';
  $('qtype').textContent=TYPE_NAME[q.t];
  $('qsrc').textContent=o.p;
  $('next').textContent = quiz.i===total-1 ? '제출하기' : '다음';
  var h=patHTML(q, ''), body;
  var longest=Math.max.apply(null,q.answer.split(/[\s-]/).map(function(x){return x.replace(/[^a-zA-Z]/g,'').length;}));
  // 칸 크기: 카드 폭에 맞춰 최대한 크게 (한 칸 ≈ 1.48em)
  var avail=Math.max(260, ($('qbody').clientWidth||318) - 4);
  var fs = Math.max(13, Math.min(34, Math.floor(avail/(1.5*Math.max(longest,1)))));
  lastUsed=0;
  var hint='<div class="pat" id="pat" style="font-size:'+fs+'px">'+h.html+'</div><div class="cnt" id="cnt">'+countHTML(h)+'</div>';
  if(q.t==='s'){
    body='<div class="prompt'+(o.k.length>40?' long':'')+'">'+esc(o.k)+'</div>'+hint;
    $('spellLbl').textContent= HINT==='none' ? '뜻에 맞는 영어 표제어를 쓰세요 · 모르면 [모름]' : '뜻에 맞는 영어 표제어를 쓰세요 · 철자만 누르면 칸이 차례로 채워집니다';
  } else {
    body='<div class="sent">'+esc(o.pre)+'<span class="sblank empty" id="sblank">'+'_'.repeat(Math.max(4,Math.min(q.answer.length,14)))+'</span>'+esc(o.post)+'</div>'+
      '<div class="mean">뜻: <b>'+esc(o.k)+'</b></div>'+hint;
    $('spellLbl').textContent= HINT==='none' ? '문장 속 형태 그대로 (시제·수 일치 포함) · 모르면 [모름]' : '문장 속 형태 그대로 (시제·수 일치 포함) · 철자만 누르면 칸이 차례로 채워집니다';
  }
  $('qbody').innerHTML=body;
  buf=''; quiz.max=h.count; $('spell').value=''; sizeKb();
}
// ---------- 화면 키보드 입력 ----------
// 학생은 알파벳만 누르고, 띄어쓰기·하이픈 등은 정답 모양(칸 배치)에 맞춰 자동으로 들어갑니다.
var buf='';
function compose(ans, hw, s){
  var n=0, out=[];
  ans.split(' ').forEach(function(tok){
    if(n>=s.length) return;
    if(isFixed(tok, hw)){ out.push(tok); return; }
    var w='';
    for(var i=0;i<tok.length && n<s.length;i++){
      var c=tok.charAt(i);
      if(/[a-zA-Z]/.test(c)){ w+=s.charAt(n); n++; } else if(w) w+=c;
    }
    out.push(w);
  });
  return out.join(' ');
}
function setBuf(v){
  var q=quiz.qs[quiz.i];
  buf=v.slice(0, quiz.max);
  $('spell').value= HINT==='none' ? buf : compose(q.answer, q.o.w, buf);
  update.call($('spell'));
}
function haptic(){
  try{ if(navigator.vibrate && navigator.vibrate(12)) return; }catch(e){}
  try{
    var l=$('hapLbl');
    if(!l){
      var w=document.createElement('div'); w.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden';
      w.innerHTML='<input type="checkbox" switch id="hapSw"><label id="hapLbl" for="hapSw"></label>';
      document.body.appendChild(w); l=$('hapLbl');
    }
    l.click();
  }catch(e){}
}
// 글자·지우기 키는 손가락을 '누르는 순간' 입력 (떼는 순간인 click보다 빠름). 다음·모름은 실수 방지를 위해 click 그대로.
function typeKey(b){
  if(b.id==='del'){ setBuf(buf.slice(0,-1)); }
  else if(b.dataset.k){ setBuf(buf+b.dataset.k); }
}
var delTimer=null, delRepeat=null;
function stopDel(){ clearTimeout(delTimer); clearInterval(delRepeat); delTimer=delRepeat=null; }
$('ansForm').addEventListener('pointerdown',function(ev){
  var b=ev.target.closest('button'); if(!b || b.disabled) return;
  if(!(b.dataset.k || b.id==='del')) return;
  ev.preventDefault();
  b.classList.add('down'); setTimeout(function(){ b.classList.remove('down'); },90);
  typeKey(b);
  haptic();
  if(b.id==='del'){ stopDel(); delTimer=setTimeout(function(){ delRepeat=setInterval(function(){ if(buf) setBuf(buf.slice(0,-1)); else stopDel(); },70); },380); }
});
['pointerup','pointercancel','pointerleave'].forEach(function(t){ $('ansForm').addEventListener(t,stopDel); });
// (컴퓨터 키보드 입력은 아래 keydown에서 처리)
// 컴퓨터에서는 실제 키보드로도 입력
document.addEventListener('keydown',function(ev){
  if($('quiz').hidden || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if(/^[a-zA-Z]$/.test(ev.key) || (HINT==='none' && /^[ '\-]$/.test(ev.key))){ setBuf(buf+ev.key.toLowerCase()); ev.preventDefault(); }
  else if(ev.key==='Backspace'){ setBuf(buf.slice(0,-1)); ev.preventDefault(); }
  else if(ev.key==='Enter'){ ev.preventDefault(); if(!$('next').disabled) $('ansForm').requestSubmit ? $('ansForm').requestSubmit() : $('next').click(); }
});
function sizeKb(){ document.documentElement.style.setProperty('--kbh', $('ansForm').offsetHeight+'px'); }
window.addEventListener('resize',function(){ if(!$('quiz').hidden) sizeKb(); });
function update(){
  $('next').disabled = this.value.trim()==='';
  var q=quiz.qs[quiz.i], h=patHTML(q, this.value);
  $('pat').innerHTML=h.html; $('cnt').innerHTML=countHTML(h); lastUsed=h.used;
  var sb=$('sblank');
  if(sb){ var v=this.value.trim(); sb.textContent = v || '_'.repeat(Math.max(4,Math.min(q.answer.length,14))); sb.classList.toggle('empty', !v); }
}
function advance(given, skipped){
  var q=quiz.qs[quiz.i];
  quiz.ans.push({q:q, right: !skipped && grade(q,given), given: skipped ? '' : given, skipped: !!skipped});
  quiz.i++;
  if(quiz.i<quiz.qs.length) show(); else finish();
}
$('ansForm').addEventListener('submit',function(ev){
  ev.preventDefault();
  if($('next').disabled) return;
  advance($('spell').value, false);
});
// 모르면 건너뛰기: 오답으로 처리하되 '모름'으로 따로 기록
$('skip').addEventListener('click',function(){ advance('', true); });
// 시험 중 다른 앱·탭으로 나간 횟수
document.addEventListener('visibilitychange',function(){
  if(document.hidden && quiz && $('quiz') && !$('quiz').hidden) quiz.leaves=(quiz.leaves||0)+1;
});

function finish(){
  clearInterval(tick);
  var secs=Math.round((Date.now()-quiz.t0)/1000);
  var score=quiz.ans.filter(function(a){return a.right;}).length, total=quiz.ans.length;
  var name=getName();
  $('quiz').hidden=true; $('result').hidden=false; document.body.classList.remove('inquiz'); window.scrollTo(0,0);
  $('rName').textContent=name+(quiz.record?'':' · 다시 풀기');
  $('rScore').textContent=score+' / '+total;
  $('rTime').textContent=Math.floor(secs/60)+'분 '+(secs%60)+'초';
  var wrong=quiz.ans.filter(function(a){return !a.right;});
  var skipped=quiz.ans.filter(function(a){return a.skipped;}).length;
  $('rExtra').textContent='모름 '+skipped+'개 · 화면 이탈 '+(quiz.leaves||0)+'회'+(PRESET && quiz.record ? ' · 숙제 '+PRESET.code : '');
  var byP={}; quiz.ans.forEach(function(a){ var p=a.q.o.p; byP[p]=byP[p]||[0,0]; byP[p][1]++; if(a.right) byP[p][0]++; });
  var ps=Object.keys(byP).sort();
  $('passCard').hidden = ps.length<2;
  $('pbars').innerHTML=ps.map(function(p){
    var r=byP[p], pct=r[0]/r[1], col= pct===1 ? 'var(--ok)' : pct<0.5 ? 'var(--bad)' : 'var(--accent)';
    return '<div class="pbar"><span class="lab">'+esc(label(p))+'</span><span class="track"><i style="width:'+Math.max(pct*100,3)+'%;background:'+col+'"></i></span><span class="num">'+r[0]+'/'+r[1]+'</span></div>';
  }).join('');
  $('rOk').textContent=score; $('rNg').textContent=total-score;
  var sent=sendToCards(wrong);
  $('toCards').hidden=!(NAV && wrong.length); $('cardNote').hidden=!sent;
  $('wrongCard').hidden = wrong.length===0;
  $('retry').hidden = wrong.length===0;
  $('wrongTitle').textContent='틀린 문제 '+wrong.length+'개';
  $('wrongList').innerHTML=wrong.map(function(a){
    var o=a.q.o;
    return '<div class="wrong"><div class="w">'+esc(o.w)+' <span class="src">'+o.p+' · '+TYPE_NAME[a.q.t]+'</span></div>'+
      '<div class="m">'+esc(o.k)+'</div>'+
      (a.q.t==='x' ? '<div class="m">정답: <b>'+esc(a.q.answer)+'</b></div>' : '')+
      '<div class="you">내 답: '+(a.skipped ? '(모름)' : esc(a.given))+'</div>'+
      '<div class="ex">'+esc(o.pre)+'<b>'+esc(o.hit)+'</b>'+esc(o.post)+'</div></div>';
  }).join('');
  var sv=$('rSave');
  if(!quiz.record){ sv.className='save wait'; sv.textContent='다시 풀기는 기록되지 않습니다.'; return; }
  try{ localStorage.setItem('vmname',name); }catch(e){}
  var now=new Date();
  var payload={tabName:TAB, studentName:name, score:score, total:total, timeTaken:secs,
    testDate: now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2),
    timestamp: now.toISOString(),
    hw: PRESET ? PRESET.code : '', ranges: quiz.ranges,
    typeName: TYPE_SET_NAME[state.type]+' · '+(state.n>0 ? state.n+'문항' : '범위 전체'),
    hintName: HINT_NAME[HINT], skipped: skipped, leaves: quiz.leaves||0,
    wrong: wrong.map(function(a){ return {p:a.q.o.p, w:a.q.o.w, k:a.q.o.k, t:TYPE_NAME[a.q.t], given: a.skipped ? '(모름)' : a.given}; })};
  sv.className='save wait'; sv.textContent='결과 저장 중…';
  saveResult(payload, 0);
}
// 결과 저장 (실패하면 자동으로 2번 더 시도, 그래도 안 되면 [다시 저장] 버튼)
function saveResult(payload, tries){
  var sv=$('rSave');
  sv.className='save wait'; sv.textContent= tries ? '다시 저장하는 중…' : '결과 저장 중…';
  PIF.post(payload).then(function(){
    sv.className='save ok'; sv.textContent='결과가 선생님께 저장되었습니다.';
  }).catch(function(){
    if(tries<2){ setTimeout(function(){ saveResult(payload, tries+1); }, 1500*(tries+1)); return; }
    sv.className='save bad';
    sv.innerHTML='저장에 실패했습니다. 인터넷 연결을 확인하고 <button type="button" id="resave" style="font:inherit;font-weight:700;color:inherit;background:#fff;border:1.5px solid currentColor;border-radius:8px;padding:4px 10px;margin-left:4px">다시 저장</button>';
    $('resave').onclick=function(){ saveResult(payload, 2); };
  });
}
$('retry').addEventListener('click',function(){
  var list=quiz.ans.filter(function(a){return !a.right;}).map(function(a){return a.q.o;});
  startQuiz(list,false);
});
$('home').addEventListener('click',function(){
  $('result').hidden=true; $('setup').hidden=false; window.scrollTo(0,0); refresh();
});
$('start').addEventListener('click',function(){
  var list=shuffle(pool());
  if(state.n>0) list=list.slice(0,state.n);
  startQuiz(list,true);
});
</script>
</body>
</html>
